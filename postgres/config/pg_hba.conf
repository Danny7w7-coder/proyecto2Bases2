# =====================================================================
#  pg_hba.conf - Quien se puede conectar, desde donde y como.
#  Se lee de arriba hacia abajo: la PRIMERA linea que coincide gana.
#
#  TIPO   BASE_DATOS   USUARIO            DIRECCION       METODO
#  (DIRECCION 'all' = cualquier IP, tanto IPv4 como IPv6)
# =====================================================================

# 1) Administrador dentro del propio contenedor (consola local)
local   all          postgres                           trust

# 2) Roles internos del cluster (FDW): NO pueden iniciar sesion desde
#    afuera. Solo se usan internamente por PostgreSQL para hablar con
#    SQL Server y MongoDB a traves de los USER MAPPING.
host    all          usr_fdw_pg_mssql   all             reject
host    all          usr_fdw_pg_mongo   all             reject

# 3) Perfiles externos (aplicaciones). Solo pueden entrar a clinica_db
#    y siempre con contrasena cifrada SCRAM-SHA-256.
host    clinica_db   usr_api_web        all             scram-sha-256
host    clinica_db   usr_api_mobile     all             scram-sha-256

# 4) Administrador desde la red (pgAdmin, DBeaver, etc.) con contrasena
host    all          postgres           all             scram-sha-256

# 5) Cualquier otra combinacion se rechaza
local   all          all                                scram-sha-256
host    all          all                all             reject
