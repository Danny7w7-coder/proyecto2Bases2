# =====================================================================
#  postgresql.conf - Servidor PostgreSQL (nucleo transaccional)
#  Solo se listan los parametros que cambiamos; el resto usa su
#  valor por defecto.
# =====================================================================

# --- Conexiones ---------------------------------------------------------
listen_addresses = '*'          # escucha en todas las interfaces (red Docker)
port = 5432
max_connections = 100

# --- Seguridad / autenticacion -----------------------------------------
password_encryption = scram-sha-256   # las contrasenas se guardan con SCRAM

# --- Memoria (valores pequenos, ambiente de laboratorio) ----------------
shared_buffers = 128MB
work_mem = 8MB

# --- Bitacora: util para demostrar en el video quien se conecta --------
log_connections = on
log_disconnections = on
log_statement = 'ddl'           # registra CREATE / ALTER / DROP
log_line_prefix = '%m [%p] usuario=%u bd=%d '

# --- Zona horaria e idioma ---------------------------------------------
timezone = 'America/Costa_Rica'
datestyle = 'iso, dmy'
