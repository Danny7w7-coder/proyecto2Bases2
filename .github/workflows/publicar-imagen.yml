# Construye la imagen de PostgreSQL (con tds_fdw y mongo_fdw) y la publica en
# GitHub Container Registry. Usa el permiso automatico del repositorio
# (GITHUB_TOKEN), por lo que no hace falta crear tokens personales.
name: Publicar imagen de PostgreSQL

on:
  push:
    branches: [main]
    paths:
      - "postgres/Dockerfile"
      - ".github/workflows/publicar-imagen.yml"
  workflow_dispatch:   # permite ejecutarlo a mano desde la pestana Actions

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Iniciar sesion en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: ./postgres
          push: true
          tags: ghcr.io/danny7w7-coder/clinica-postgres:1.0
